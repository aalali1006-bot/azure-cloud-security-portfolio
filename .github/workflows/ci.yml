name: Cloud Security Lab CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate IaC and detection code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without remote backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate -no-color

      - name: Run sign-in analyzer tests
        run: python3 -m unittest discover -s tests -v

      - name: Run analyzer against simulated data
        run: >-
          python3 scripts/analyze_signins.py
          --input sample_logs/simulated_signins.jsonl
          --output artifacts/simulated_signin_report.json

      - name: Upload simulated report
        uses: actions/upload-artifact@v4
        with:
          name: simulated-signin-report
          path: artifacts/simulated_signin_report.json
